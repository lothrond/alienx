---
# Substituted at image-build time by the Makefile.
# Do not edit the placeholders.
#
# (console) performance tuning (config/gaming.mk)
#
# Values not listed here (renice, sysctl numbers, scheduler
# names, MSI, coolbits) are baked directly into assets/ansible/files/*
# by the same sed pass, not routed through ansible vars.

console_irqbalance_enabled: "__IRQBALANCE_ENABLED__"
gamemode_enabled: "__GAMEMODE_ENABLED__"
mangohud_enabled: "__MANGOHUD_ENABLED__"
