---
# Post-install
# Alienware X51 R3
# Debian
# 13 (Trixie)

# Setup base system.
- name: Post-install setup for base profiles
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - group_vars/profile.yml
    - group_vars/shared.yml

  tasks:
    - name: Set system hostname
      when: profile == "base"
      hostname:
        name: "{{ hostname }}"

    - name: Ensure admin user is in the sudo users group
      when: profile == "base"
      user:
        name: "{{ username_admin }}"
        groups: sudo
        append: true

    - name: Ensure root account is locked
      when: profile == "base"
      user:
        name: root
        password_lock: true

# Setup console system.
- name: Post-install setup for console profiles
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - group_vars/profile.yml
    - group_vars/console.yml
    - group_vars/shared.yml

  tasks:
    - name: Steam session (console only) autologin
      when: native_steam == "yes" or native_steam == "Yes"
      copy:
        dest: /etc/sddm.conf.d
        src: files/autologin.conf
        mode: "0644"

    - name: Enable and starting tuned
      when: profile == "console"
      systemd:
        name: tuned
        enabled: true
        state: started

    - name: Set tuned profile to latency-performance
      when: profile == "console"
      command: tuned-adm profile latency-performance
      changed_when: true

    - name: Blacklist nouveau for nvidia graphics
      when: graphics == "nvidia" and profile == "console"
      copy:
        dest: /etc/modprobe.d/
        src: files/blacklist-nouveau.conf
        mode: "0644"

    - name: Enable console display manager
      when: native_steam == "yes" or native_steam  == "Yes"
      systemd:
        name: sddm
        enabled: true

    - name: Console / Steam block (wip)
      when: native_steam == "yes" or native_steam == "Yes"
      block:
        - name: Enable i386 architecture (idempotent)
          command: dpkg --add-architecture i386
          changed_when: true

        - name: Create gamer user
          user:
            name: "{{ username_console }}"
            comment: "{{ fullname_game }}"
            password: "{{ game_password_hash }}"
            groups: sudo,video,audio,input,render,users
            append: true
            shell: /bin/bash
            create_home: true

        - name: Passwordless sudo for gamer
          copy:
            dest: "/etc/sudoers.d/{{ username_console }}"
            content: "{{ username_console }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
            mode: "0440"
            validate: visudo -cf %s

        - name: Ensure xsessions directory exists
          file:
            path: /usr/share/Xsessions
            state: directory
            mode: "0755"

        - name: Install Steam Big Picture session desktop file
          copy:
            src: files/steam-session.desktop
            dest: /usr/share/xsessions/steam-session.desktop
            mode: "0644"

        - name: Install Steam session launcher
          copy:
            src: files/steam-session.sh
            dest: /usr/local/bin/steam-session.sh
            mode: "0755"

        - name: Install steamos-update helper
          copy:
            src: files/steamos-update
            dest: /usr/bin/steamos-update
            mode: "0755"

        - name: Raise vm.max_map_count for Proton
          sysctl:
            name: vm.max_map_count
            value: "2147483642"
            state: present
            sysctl_set: true
            reload: true

        - name: Create Steam cache directory
          file:
            path: "/home/{{ username_console }}/.cache/steam"
            state: directory
            owner: "{{ username_console }}"
            group: "{{ username_console }}"
            mode: "0755"

        - name: Install Flatpak (for ProtonUp-Qt)
          when: proton_ge == "yes" or proton_ge == "Yes"
          apt:
            name: flatpak
            state: present
            update_cache: true

        - name: Add Flathub remote
          when: proton_ge == "yes" or proton_ge == "Yes"
          command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          changed_when: true

        - name: Install ProtonUp-Qt Flatpak
          when: proton_ge == "yes" or proton_ge == "Yes"
          command: flatpak install -y flathub net.davidotek.pupgui2
          register: pupgui_install
          failed_when: false
          changed_when: pupgui_install.rc == 0

        - name: Install Decky Loader
          when: decky == "yes" or decky == "Yes"
          become_user: "{{ username_console }}"
          block:
            - name: Ensure curl is present
              apt:
                name: curl
                state: present
              become: true

            - name: Download Decky installer
              get_url:
                url: https://github.com/SteamDeckHomebrew/decky-installer/releases/latest/download/install_release.sh
                dest: /tmp/decky_install.sh
                mode: "0755"
                timeout: 30
              register: decky_download
              failed_when: false

            - name: Run Decky installer
              when: decky_download is succeeded
              shell: |
                set -e
                export HOME="/home/{{ username_console }}"
                export USER="{{ username_console }}"
                bash /tmp/decky_install.sh
              args:
                creates: "/home/{{ username_console }}/homebrew/services/PluginLoader"
              register: decky_install
              failed_when: false
              changed_when: decky_install.rc == 0

            - name: Clean up installer
              file:
                path: /tmp/decky_install.sh
                state: absent
              failed_when: false

            - name: Note Decky status
              debug:
                msg: >-
                  Decky Loader
                  {{ 'installed' if (decky_install is defined and decky_install.rc == 0)
                     else 'skipped / failed (non-fatal)' }}

# Setup system performance.
- name: Post-install console performance setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - group_vars/profile.yml
    - group_vars/console.yml
    - group_vars/performance.yml
    - group_vars/shared.yml

  tasks:
    - name: Gaming / performance tuning block
      when:
        - native_steam == "yes" or native_steam == "Yes"
        - profile == "desktop"
      block:
        - name: Deploy cpupower governor config
          when: cpu_governor_performance | bool
          register: cpupower_conf
          copy:
            src: files/cpupower
            dest: /etc/default
            mode: "0644"

        - name: Ensure cpupower.service is enabled
          when: cpu_governor_performance | bool
          systemd:
            name: cpupower.service
            enabled: true
            state: started

        - name: Restart cpupower after config change
          systemd:
            name: cpupower.service
            state: restarted
          when:
            - cpu_governor_performance | bool
            - cpupower_conf is changed

        - name: Enable irqbalance
          systemd:
            name: irqbalance.service
            enabled: true
            state: started
          when: irqbalance_enabled | bool

        - name: Disable irqbalance
          systemd:
            name: irqbalance.service
            enabled: false
            state: stopped
          when: not (irqbalance_enabled | bool)
          failed_when: false

        - name: Deploy system-wide gamemode.ini
          copy:
            src: files/gamemode.ini
            dest: /etc/gamemode.ini
            mode: "0644"
          when: gamemode_enabled | bool

        - name: Add console user to the gamemode group
          user:
            name: "{{ username_console }}"
            groups: gamemode
            append: true
          when: gamemode_enabled | bool
          failed_when: false

        - name: Force PowerMizer to max-performance level via modprobe
          copy:
            src: files/nvidia-perf.conf
            dest: /etc/modprobe.d/nvidia-perf.conf
            mode: "0644"
          when:
            - graphics == "nvidia"
            - nvidia_powermizer_max_perf | bool
          register: nvidia_modprobe_conf

        - name: Update initramfs after NVIDIA modprobe change
          command: update-initramfs -u
          when:
            - graphics == "nvidia"
            - nvidia_powermizer_max_perf | bool
            - nvidia_modprobe_conf is changed
          changed_when: true

        - name: Deploy Xorg NVIDIA performance options
          copy:
            src: files/20-nvidia-perf.conf
            dest: /etc/X11/xorg.conf.d/20-nvidia-perf.conf
            mode: "0644"
          when:
            - graphics == "nvidia"
            - nvidia_xorg_tuning | bool

        - name: Deploy gaming kernel sysctl tuning
          copy:
            src: files/99-console-sysctl.conf
            dest: /etc/sysctl.d/99-gaming-sysctl.conf
            mode: "0644"
          when: sysctl_tuning == "yes" or sysctl_tuning == "Yes"
          register: console_sysctl_conf

        - name: Reload sysctl after gaming tuning change
          command: sysctl --system
          when:
            - sysctl_tuning == "yes" or sysctl_tuning == "Yes"
            - sysctl_conf is changed
          changed_when: true

        - name: Deploy I/O scheduler udev rules
          when: io_scheduler_tuning == "yes" or io_scheduler_tuning == "Yes"
          copy:
            src: files/60-io-scheduler.rules
            dest: /etc/udev/rules.d/60-io-scheduler.rules
            mode: "0644"
          register: io_scheduler_rules

        - name: Reload udev after I/O scheduler rule change
          command: udevadm control --reload-rules
          when:
            - io_scheduler_tuning == "yes" or io_scheduler_tuning == "Yes"
            - io_scheduler_rules is changed
          changed_when: true

        - name: Ensure MangoHud config dir exists
          when: mangohud_enabled == "yes" or mangohud_enabled == "Yes"
          failed_when: false
          file:
            path: "/home/{{ username_console }}/.config/MangoHud"
            state: directory
            owner: "{{ username_console }}"
            group: "{{ username_console }}"
            mode: "0755"

        - name: Deploy default MangoHud config
          when: mangohud_enabled == "yes" or mangohud_enabled == "Yes"
          failed_when: false
          copy:
            src: files/MangoHud.conf
            dest: "/home/{{ username_console }}/.config/MangoHud/MangoHud.conf"
            owner: "{{ username_console }}"
            group: "{{ username_console }}"
            mode: "0644"

# Setup desktop system.
- name: Post-install setup for desktop profiles
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - group_vars/desktop.yml
    - group_vars/profile.yml
    - group_vars/shared.yml

  tasks:
    - name: Blacklist nouveau for nvidia graphics
      when: graphics == "nvidia" and (profile == "desktop")
      copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        src: files/blacklist-nouveau.conf
        mode: "0644"

    - name: Enable SDDM (For Plasma desktop)
      when: desktop == "plasma"
      systemd:
        name: sddm
        enabled: true

    - name: Enable GDM (For GNOME desktop)
      when: desktop == "gnome" and (native_steam != "yes" or native_steam != "Yes")
      systemd:
        name: gdm3
        enabled: true

    - name: Enable LightDM (For the i3 desktop)
      when: desktop == "i3" and not (native_steam | bool)
      systemd:
        name: lightdm
        enabled: true

# Shared system plays.
- name: Shared post-install setup for profiles
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - group_vars/profile.yml
    - group_vars/console.yml
    - group_vars/desktop.yml
    - group_vars/shared.yml

  tasks:
    - name: Deploy native iptables firewall
      when: firewall_enabled == "yes" or firewall_enabled == "Yes"
      block:
        - name: Install firewall script
          copy:
            src: files/iptables-firewall.sh
            dest: /usr/local/bin/iptables-firewall.sh
            mode: "0755"

        - name: Install firewall systemd unit
          copy:
            src: files/iptables-firewall.service
            dest: /etc/systemd/system/iptables-firewall.service
            mode: "0644"

        - name: Enable and start firewall service
          systemd:
            name: iptables-firewall.service
            enabled: true
            daemon_reload: true
            state: started

    - name: Enable web console (cockpit socket)
      when: cockpit_enabled == "yes" or cockpit_enabled == "Yes"
      systemd:
        name: cockpit.socket
        enabled: true
        state: started

    - name: Override Cockpit listen port
      when:
        - cockpit_enabled == "yes" or cockpit_enabled == "Yes"
        - cockpit_port | string != "9090"
      block:
        - name: Create cockpit.socket drop-in directory
          file:
            path: /etc/systemd/system/cockpit.socket.d
            state: directory
            mode: "0755"

        - name: Write cockpit port override
          copy:
            dest: /etc/systemd/system/cockpit.socket.d/
            src: files/override.conf
            mode: "0644"

        - name: Reload systemd after cockpit override
          systemd:
            daemon_reload: true

    - name: Install GRUB defaults for selected graphics card
      when: graphics in ["nvidia", "amd", "intel"]
      copy:
        src: "files/grub.{{ graphics }}"
        dest: /etc/default/grub
        mode: "0644"

    - name: Update GRUB
      when: graphics in ["nvidia", "amd", "intel"]
      command: update-grub
      changed_when: true

    # Bluray.
    - name: Create AACS (Blu-ray)
      when: bluray == "yes" or bluray == "Yes"
      file:
        path: /etc/aacs
        state: directory
        mode: "0755"

    # Backrounds.
    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/wallpapers/Alienware
        state: directory
        mode: "0755"

    - name: Install desktop backgrounds
      copy:
        src: "{{ item }}"
        dest: /usr/share/wallpapers/Alienware/
        mode: "0644"
      with_fileglob:
        - ../backgrounds/*
      ignore_errors: true

    # First-boot MOTD.
    - name: Write first-boot MOTD
      when: profile in ["base", "console", "desktop"]
      copy:
        dest: /etc/motd
        src: files/motd.{{ profile }}
        mode: "0644"

    - name: Post-install finished
      debug:
        msg: "Ansible playbook finished successfully."

