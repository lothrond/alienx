native_steam: "__NATIVE_STEAM__"

cockpit_enabled: "__COCKPIT_ENABLED__"
cockpit_port: "__COCKPIT_PORT__"
firewall_enabled: "__FIREWALL_ENABLED__"

username_admin: "__USER_ADMIN__"
