# Managed by mkdeb gaming/performance tuning (see config/gaming.mk).
# vm.max_map_count: several Proton/native titles need a higher mapping
# limit than Debian's default (65530); Valve's own Steam client tries to
# raise this at runtime too. vm.swappiness: keep more in RAM before
# swapping on a console box with headroom to spare.
vm.max_map_count=__GAMING_SYSCTL_VM_MAX_MAP_COUNT__
vm.swappiness=__GAMING_SYSCTL_VM_SWAPPINESS__
