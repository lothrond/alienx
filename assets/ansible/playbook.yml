---
# Post-install
# Alienware X51 R3
# Debian
# 13 (Trixie)
# netinst

# (Still a draft.)
# (Now with motd.)

- name: Debian post-install setup for Alienware X51 R3
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - group_vars/all.yml

  tasks:

    # ================================================================
    # 1. Base system
    # ================================================================
    - name: Set hostname
      hostname:
        name: "{{ hostname }}"

    - name: Ensure admin user is in sudo group
      user:
        name: "{{ username_admin }}"
        groups: sudo
        append: true

    - name: Ensure root account remains locked
      user:
        name: root
        password_lock: true

    - name: Enable and start tuned
      systemd:
        name: tuned
        enabled: true
        state: started

    - name: Set tuned profile to latency-performance
      command: tuned-adm profile latency-performance
      changed_when: true

    - name: Enable Cockpit socket
      when: cockpit_enabled | bool
      systemd:
        name: cockpit.socket
        enabled: true
        state: started

    - name: Override Cockpit listen port
      when:
        - cockpit_enabled | bool
        - cockpit_port | string != "9090"
      block:
        - name: Create cockpit.socket drop-in directory
          file:
            path: /etc/systemd/system/cockpit.socket.d
            state: directory
            mode: "0755"

        - name: Write cockpit port override
          copy:
            dest: /etc/systemd/system/cockpit.socket.d/override.conf
            content: |
              [Socket]
              ListenStream=
              ListenStream={{ cockpit_port }}
            mode: "0644"

        - name: Reload systemd after cockpit override
          systemd:
            daemon_reload: true

    - name: Deploy native iptables firewall
      when: firewall_enabled | bool
      block:
        - name: Install firewall script
          copy:
            src: files/iptables-firewall.sh
            dest: /usr/local/bin/iptables-firewall.sh
            mode: "0755"

        - name: Install firewall systemd unit
          copy:
            src: files/iptables-firewall.service
            dest: /etc/systemd/system/iptables-firewall.service
            mode: "0644"

        - name: Enable and start firewall service
          systemd:
            name: iptables-firewall.service
            enabled: true
            daemon_reload: true
            state: started

    # ================================================================
    # 2. GPU stack (packages already present from preseed)
    # ================================================================
    - name: Nvidia – blacklist nouveau
      when: driver_stack == "nvidia"
      copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        content: |
          blacklist nouveau
          options nouveau modeset=0
        mode: "0644"

    - name: Install GRUB defaults for selected GPU stack
      copy:
        src: "files/grub.{{ driver_stack }}"
        dest: /etc/default/grub
        mode: "0644"
      when: driver_stack in ["nvidia", "amd", "intel"]

    - name: Update GRUB
      when: driver_stack in ["nvidia", "amd", "intel"]
      command: update-grub
      changed_when: true

    # ================================================================
    # 3. Display manager
    # ================================================================
    - name: Enable SDDM (Plasma desktop or Steam console)
      when: desktop == "plasma" or (native_steam | bool)
      systemd:
        name: sddm
        enabled: true

    - name: Enable GDM (GNOME)
      when: desktop == "gnome" and not (native_steam | bool)
      systemd:
        name: gdm3
        enabled: true

    - name: Enable LightDM (i3)
      when: desktop == "i3" and not (native_steam | bool)
      systemd:
        name: lightdm
        enabled: true

    # Auto-login is intentionally limited to the console profile only
    - name: SDDM autologin → Steam session (console only)
      when: native_steam | bool
      copy:
        dest: /etc/sddm.conf.d/autologin.conf
        content: |
          [Autologin]
          User={{ username_game }}
          Session=steam-session.desktop
        mode: "0644"

    # ================================================================
    # 4. Console / Steam Big Picture
    # ================================================================
    - name: Console / Steam block
      when: native_steam | bool
      block:
        - name: Enable i386 architecture (idempotent)
          command: dpkg --add-architecture i386
          changed_when: true

        - name: Create gamer user
          user:
            name: "{{ username_game }}"
            comment: "{{ fullname_game }}"
            password: "{{ game_password_hash }}"
            groups: sudo,video,audio,input,render,users
            append: true
            shell: /bin/bash
            create_home: true

        - name: Passwordless sudo for gamer
          copy:
            dest: "/etc/sudoers.d/{{ username_game }}"
            content: "{{ username_game }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
            mode: "0440"
            validate: visudo -cf %s

        - name: Ensure xsessions directory exists
          file:
            path: /usr/share/xsessions
            state: directory
            mode: "0755"

        - name: Install Steam Big Picture session desktop file
          copy:
            src: files/steam-session.desktop
            dest: /usr/share/xsessions/steam-session.desktop
            mode: "0644"

        - name: Install Steam session launcher
          copy:
            src: files/steam-session.sh
            dest: /usr/local/bin/steam-session.sh
            mode: "0755"

        - name: Install steamos-update helper
          copy:
            src: files/steamos-update
            dest: /usr/bin/steamos-update
            mode: "0755"

        - name: Raise vm.max_map_count for Proton
          sysctl:
            name: vm.max_map_count
            value: "2147483642"
            state: present
            sysctl_set: true
            reload: true

        - name: Create Steam cache directory
          file:
            path: "/home/{{ username_game }}/.cache/steam"
            state: directory
            owner: "{{ username_game }}"
            group: "{{ username_game }}"
            mode: "0755"

        - name: Install Flatpak (for ProtonUp-Qt)
          when: proton_ge | bool
          apt:
            name: flatpak
            state: present
            update_cache: true

        - name: Add Flathub remote
          when: proton_ge | bool
          command: flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          changed_when: true

        - name: Install ProtonUp-Qt Flatpak
          when: proton_ge | bool
          command: flatpak install -y flathub net.davidotek.pupgui2
          register: pupgui_install
          failed_when: false
          changed_when: pupgui_install.rc == 0

        - name: Install Decky Loader (console only, best-effort but safer)
          when: decky | bool
          become_user: "{{ username_game }}"
          block:
            - name: Ensure curl is present
              apt:
                name: curl
                state: present
              become: true

            - name: Download Decky installer
              get_url:
                url: https://github.com/SteamDeckHomebrew/decky-installer/releases/latest/download/install_release.sh
                dest: /tmp/decky_install.sh
                mode: "0755"
                timeout: 30
              register: decky_download
              failed_when: false

            - name: Run Decky installer
              when: decky_download is succeeded
              shell: |
                set -e
                export HOME="/home/{{ username_game }}"
                export USER="{{ username_game }}"
                bash /tmp/decky_install.sh
              args:
                creates: "/home/{{ username_game }}/homebrew/services/PluginLoader"
              register: decky_install
              failed_when: false
              changed_when: decky_install.rc == 0

            - name: Clean up installer
              file:
                path: /tmp/decky_install.sh
                state: absent
              failed_when: false

            - name: Note Decky status
              debug:
                msg: >-
                  Decky Loader
                  {{ 'installed' if (decky_install is defined and decky_install.rc == 0)
                     else 'skipped / failed (non-fatal)' }}

    # ================================================================
    # 5. Gaming / performance tuning (console profile)
    # ================================================================
    # Sourced from ArchWiki: Gaming, Improving performance, GameMode,
    # NVIDIA/Tips and tricks; and Debian Wiki: NvidiaGraphicsDrivers,
    # NvidiaGraphicsDrivers/Configuration. Scoped to this hardware target:
    # 6th-gen Skylake i5/i7, Nvidia Maxwell (GTX 745/960/970) on the
    # nvidia-tesla-470 branch (CHANGELOG.md).
    #
    # Packages (linux-cpupower, irqbalance, mangohud, vulkan libs) come
    # from preseed via packages.mk's PKGS_GAMING_TWEAKS group -- gamemode
    # itself already ships in PKGS_STEAM. This section only configures,
    # matching the project's preseed-installs/Ansible-configures split.
    - name: Gaming / performance tuning block
      when: native_steam | bool
      block:
        - name: Deploy cpupower governor config
          copy:
            src: files/cpupower
            dest: /etc/default/cpupower
            mode: "0644"
          when: gaming_cpu_governor_performance | bool
          register: cpupower_conf

        - name: Ensure cpupower.service is enabled
          systemd:
            name: cpupower.service
            enabled: true
            state: started
          when: gaming_cpu_governor_performance | bool

        - name: Restart cpupower after config change
          systemd:
            name: cpupower.service
            state: restarted
          when:
            - gaming_cpu_governor_performance | bool
            - cpupower_conf is changed

        # ArchWiki (Improving performance): irqbalance can redistribute
        # IRQs away from the core handling a game's interrupts and cause
        # stutter. Off by default for console -- see group_vars/all.yml.
        - name: Enable irqbalance
          systemd:
            name: irqbalance.service
            enabled: true
            state: started
          when: gaming_irqbalance_enabled | bool

        - name: Disable irqbalance
          systemd:
            name: irqbalance.service
            enabled: false
            state: stopped
          when: not (gaming_irqbalance_enabled | bool)
          failed_when: false

        - name: Deploy system-wide gamemode.ini
          copy:
            src: files/gamemode.ini
            dest: /etc/gamemode.ini
            mode: "0644"
          when: gaming_gamemode_enabled | bool

        - name: Add gamer user to the gamemode group
          user:
            name: "{{ username_game }}"
            groups: gamemode
            append: true
          when: gaming_gamemode_enabled | bool
          failed_when: false

        - name: Force PowerMizer to max-performance level via modprobe
          copy:
            src: files/nvidia-perf.conf
            dest: /etc/modprobe.d/nvidia-perf.conf
            mode: "0644"
          when:
            - driver_stack == "nvidia"
            - gaming_nvidia_powermizer_max_perf | bool
          register: nvidia_modprobe_conf

        - name: Update initramfs after NVIDIA modprobe change
          command: update-initramfs -u
          when:
            - driver_stack == "nvidia"
            - gaming_nvidia_powermizer_max_perf | bool
            - nvidia_modprobe_conf is changed
          changed_when: true

        - name: Deploy Xorg NVIDIA performance options
          copy:
            src: files/20-nvidia-perf.conf
            dest: /etc/X11/xorg.conf.d/20-nvidia-perf.conf
            mode: "0644"
          when:
            - driver_stack == "nvidia"
            - gaming_nvidia_xorg_tuning | bool

        - name: Deploy gaming sysctl tuning
          copy:
            src: files/99-gaming-sysctl.conf
            dest: /etc/sysctl.d/99-gaming-sysctl.conf
            mode: "0644"
          when: gaming_sysctl_tuning | bool
          register: gaming_sysctl_conf

        - name: Reload sysctl after gaming tuning change
          command: sysctl --system
          when:
            - gaming_sysctl_tuning | bool
            - gaming_sysctl_conf is changed
          changed_when: true

        - name: Deploy I/O scheduler udev rules
          copy:
            src: files/60-io-scheduler.rules
            dest: /etc/udev/rules.d/60-io-scheduler.rules
            mode: "0644"
          when: gaming_io_scheduler_tuning | bool
          register: io_scheduler_rules

        - name: Reload udev after I/O scheduler rule change
          command: udevadm control --reload-rules
          when:
            - gaming_io_scheduler_tuning | bool
            - io_scheduler_rules is changed
          changed_when: true

        - name: Ensure MangoHud config dir exists
          file:
            path: "/home/{{ username_game }}/.config/MangoHud"
            state: directory
            owner: "{{ username_game }}"
            group: "{{ username_game }}"
            mode: "0755"
          when: gaming_mangohud_enabled | bool
          failed_when: false

        - name: Deploy default MangoHud config
          copy:
            src: files/MangoHud.conf
            dest: "/home/{{ username_game }}/.config/MangoHud/MangoHud.conf"
            owner: "{{ username_game }}"
            group: "{{ username_game }}"
            mode: "0644"
          when: gaming_mangohud_enabled | bool
          failed_when: false

    # ================================================================
    # 6. Extras
    # ================================================================
    - name: Create AACS directory (Blu-ray)
      file:
        path: /etc/aacs
        state: directory
        mode: "0755"
      when: native_steam | bool or desktop != "none"

    - name: Ensure wallpaper directory exists
      file:
        path: /usr/share/wallpapers/Alienware
        state: directory
        mode: "0755"

    - name: Install wallpapers
      copy:
        src: "{{ item }}"
        dest: /usr/share/wallpapers/Alienware/
        mode: "0644"
      with_fileglob:
        - backgrounds/*
      ignore_errors: true

    # ================================================================
    # 7. First-boot MOTD
    # ================================================================
    - name: Write first-boot MOTD
      copy:
        dest: /etc/motd
        content: |
          ---------------------------------------------------------
            Alienware X51 R3 recovery image
            GPU stack            : {{ driver_stack }}
            Session              : {{ session_type }}
            Desktop              : {{ desktop }}
            Admin                : {{ username_admin }} (sudo)
          {% if native_steam | bool %}
            Gamer                : {{ username_game }} (Steam)
            Proton-GE tooling    : {{ proton_ge }}
            Decky                : {{ decky }}
            Gaming/perf tuning   : governor={{ 'performance' if gaming_cpu_governor_performance | bool else 'default' }}, gamemode={{ gaming_gamemode_enabled }}
          {% endif %}
            Browser              : {{ browser }}
            Office               : {{ office }}
            Cockpit              : https://<host>:{{ cockpit_port }}
          ---------------------------------------------------------
            Root is locked. Use sudo from the admin account.
          ---------------------------------------------------------
        mode: "0644"

    - name: Post-install finished
      debug:
        msg: "Ansible post-install finished successfully."
