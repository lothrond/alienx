; Managed by mkdeb gaming/performance tuning (see config/gaming.mk).
; Reference: ArchWiki "GameMode"; FeralInteractive/gamemode Configuration docs.
;
; [gpu] settings are only honored from /etc/gamemode.ini -- values in a
; per-user ~/.config/gamemode.ini or ./gamemode.ini are treated as "unsafe"
; and ignored for GPU optimizations. Keep this file as the source of truth.

[general]
renice=__GAMING_GAMEMODE_RENICE__
ioprio=__GAMING_GAMEMODE_IOPRIO__
softrealtime=__GAMING_GAMEMODE_SOFTREALTIME__
inhibit_screensaver=__GAMING_GAMEMODE_INHIBIT_SCREENSAVER__

[gpu]
apply_gpu_optimizations=accept-responsibility
gpu_device=0
; nv_powermizer_mode=1 (prefer max performance) matches the modprobe-level
; PowerMizerLevel=0x3 pin in nvidia-perf.conf.
nv_powermizer_mode=1
nv_core_clock_mhz_offset=0
nv_mem_clock_mhz_offset=0

[cpu]
park_cores=no
pin_cores=no
