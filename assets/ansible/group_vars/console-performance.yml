gaming_gamemode_enabled: "__GAMING_GAMEMODE_ENABLED__"
gaming_nvidia_powermizer_max_perf: "__GAMING_NVIDIA_POWERMIZER_MAX_PERF__"
gaming_nvidia_xorg_tuning: "__GAMING_NVIDIA_XORG_TUNING__"
gaming_sysctl_tuning: "__GAMING_SYSCTL_TUNING__"
gaming_io_scheduler_tuning: "__GAMING_IO_SCHEDULER_TUNING__"
gaming_mangohud_enabled: "__GAMING_MANGOHUD_ENABLED__"
